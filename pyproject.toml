[project]
name = "lumos-assistive-ai"
version = "2.0.0"
description = "LUMOS Assistive AI OpenEnv — POMDP environment for wearable smart glasses AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "pydantic==2.9.2",
    "numpy==1.26.4",
    "openai>=2.7.2",
    "requests",
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
name = "lumos-assistive-ai"
version = "2.0.0"

[tool.uv]
environments = ["python_version >= '3.11' and python_version < '3.13'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
